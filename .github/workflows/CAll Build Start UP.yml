name: CAll Build Start UP

on:
  workflow_dispatch:
    inputs:
      BATCH:
        description: "9个一组分批并行-选择分支(1-4)"
        required: true
        default: "1"
      CONFIRMATION:
        description: "我已看完README.md,了解此工作流的风险和作用,有能力取消卡住的工作流运行和删除缓存,并执意继续运行"
        required: true
        default: "请输入完整标题"

permissions:
  actions: write
  contents: read

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Check User Confirmation
        run: |
          CONFIRM="${{ github.event.inputs.CONFIRMATION }}"
          EXPECT="我已看完README.md,了解此工作流的风险和作用,有能力取消卡住的工作流运行和删除缓存,并执意继续运行"

          if [[ "$CONFIRM" != "$EXPECT" ]]; then
            echo "❌ 输入无效，您未正确确认工作流风险。请阅读更新日志并正确输入确认内容。如果你仅仅只是想运行单个机型，这不是你该来的地方，请使用本仓库的另外一个工作流文件 Build All OnePlus Kernels"
            exit 1
          fi

      - name: Set Matrix from FILE List
        id: set-matrix
        run: |
          BATCH="${{ github.event.inputs.BATCH }}"

          if [[ "$BATCH" == "1" ]]; then
            FILE_LIST=(
              "oneplus_nord_ce4_lite_5g_A15"
              "oneplus_nord_ce4_A15"
              "oneplus_nord_4_A15"
              "oneplus_ace_3v_A15"
              "oneplus_10_pro_A15"
              "oneplus_10t_A15"
              "oneplus_11r_A15"
              "oneplus_ace2_A15"
              "oneplus_ace_pro_A15"
            )
          elif [[ "$BATCH" == "2" ]]; then
            FILE_LIST=(
              "oneplus_11_A15"
              "oneplus_12r_A15"
              "oneplus_ace2_pro_A15"
              "oneplus_ace3_A15"
              "oneplus_open_A15"
              "oneplus_12_A15"
              "oneplus_13r"
              "oneplus_ace3_pro_A15"
              "oneplus_ace5"
            )
          elif [[ "$BATCH" == "3" ]]; then
            FILE_LIST=(
              "oneplus_pad_pro_A15"
              "oneplus_pad2_A15"
              "oneplus_nord_5"
              "oneplus_ace5_pro"
              "oneplus_ace5_pro_A16"
              "oneplus_13"
              "oneplus_13_A16"
              "oneplus_13t"
              "oneplus_13t_A16"
            )
          elif [[ "$BATCH" == "4" ]]; then
            FILE_LIST=(
              "oneplus_13_global"
              "oneplus_13s"
              "oneplus_13s_A16"
              "oneplus_pad_2_pro"
              "oneplus_pad_3"
              "oneplus_ace5_ultra"
              "oneplus_ace_6"
              "oneplus_15"
            )
          else
            echo "无效的 BATCH 值: $BATCH"
            exit 1
          fi

          MATRIX_JSON=$(printf '%s\n' "${FILE_LIST[@]}" | jq -R -s -c '
            split("\n")[:-1] |
            map({
              file: .,
              enable_sched: (
                . == "oneplus_pad_2_pro" or
                . == "oneplus_13" or
                . == "oneplus_13_global" or
                . == "oneplus_13t" or
                . == "oneplus_13s" or
                . == "oneplus_ace5_ultra" or
                . == "oneplus_ace5_pro"
              )
            })
          ')
          echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT

  build:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Call Original Workflow
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Build All OnePlus Kernels
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          inputs: |
            {
              "FILE": "${{ matrix.file }}",
              "BATCH_ID": "${{ github.run_id }}-${{ github.run_attempt }}",
              "SUSFS_CI": "N/A",
              "KSU_META": "main/main/王德发刷机/",
              "BUILD_TIME": "F",
              "SUFFIX": "",
              "FAST_BUILD": "true",
              "LSM_BBG": "true",
              "SCHED_HMBIRD": "${{ matrix.enable_sched }}",
              "ZRAM": "0/lz4kd/8589934592"
            }

      - name: Wait for Current Build and Download AnyKernel3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TITLE: "${{ matrix.file }} · FAST [batch:${{ github.run_id }}-${{ github.run_attempt }}]"
        run: |
          # Locate this child run by batch ID and FILE, not a historical artifact name.
          SECONDS=0
          MAX_TIME=$((35 * 60))
          RUN_ID=""
          CONCLUSION=""
          while (( SECONDS < MAX_TIME )); do
            if [ -z "$RUN_ID" ]; then
              RUNS=$(gh api --method GET --paginate \
                "repos/$GITHUB_REPOSITORY/actions/workflows/Build%20Kernel%20OnePlus.yml/runs" \
                -f event=workflow_dispatch -f branch="$GITHUB_REF_NAME" -f per_page=100)
              RUN_ID=$(printf '%s' "$RUNS" | jq -sr --arg title "$TARGET_TITLE" --arg sha "$GITHUB_SHA" \
                '[.[].workflow_runs[] | select(.display_title == $title and .head_sha == $sha)] | max_by(.id) | .id // empty')
            fi
            if [ -n "$RUN_ID" ]; then
              RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
              if [ "$(printf '%s' "$RUN" | jq -r '.status')" = "completed" ]; then
                CONCLUSION=$(printf '%s' "$RUN" | jq -r '.conclusion')
                break
              fi
            fi
            echo "等待本次子构建：$TARGET_TITLE ($SECONDS 秒)"
            sleep 60
          done
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::子构建未成功：$TARGET_TITLE，run=$RUN_ID，结果=${CONCLUSION:-timeout}"
            exit 1
          fi

          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false and (.name | startswith("AnyKernel3_"))) | [.id, .name] | @tsv' > artifacts.tsv
          if [ ! -s artifacts.tsv ]; then
            echo "::error::成功的子构建 $RUN_ID 没有可下载的 AnyKernel3 产物"
            exit 1
          fi
          mkdir -p all_artifacts
          while IFS=$'\t' read -r ARTIFACT_ID NAME; do
            curl -fL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
              -o "all_artifacts/${NAME}_run${RUN_ID}.zip" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"
          done < artifacts.tsv

      - name: Stage Current Build ZIP
        uses: actions/upload-artifact@v7
        with:
          name: batch-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.file }}
          path: all_artifacts/*.zip
          compression-level: 0
          if-no-files-found: error

  wait-and-download:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect Current Batch ZIPs
        uses: actions/download-artifact@v8
        with:
          pattern: batch-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: all_artifacts
          merge-multiple: true

      - name: Create Final ZIP
        run: |
          cd all_artifacts
          zip -r ../All-AnyKernel3-ReSukiSU-${{ inputs.BATCH }}.zip ./*.zip

      - name: Upload Combined ZIP Artifact
        uses: actions/upload-artifact@v7
        with:
          name: All-AnyKernel3-ReSukiSU-${{ inputs.BATCH }}
          path: All-AnyKernel3-ReSukiSU-${{ inputs.BATCH }}.zip
          if-no-files-found: error
